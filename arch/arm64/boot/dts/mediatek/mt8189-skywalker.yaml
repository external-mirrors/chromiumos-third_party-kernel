DEFAULT: {}

skywalker:
  dtb:
    mt8189-skywalker.dtb: {}

anakin:
  dtb:
    mt8189-skywalker-anakin.dtb: {}
  dtbo:
    mt8189-skywalker-anakin-kb-v10.dtbo:
      rev:
        max: 1
    mt8189-skywalker-anakin-touchscreen.dtbo:
      fw_config:
        mask: 0x1
        value: 0x1
    mt8189-skywalker-anakin-usb-c1.dtbo:
      fw_config:
        mask: 0x300
        value: 0x000

baze:
  dtb:
    mt8189-skywalker-baze.dtb: {}
  dtbo:
    mt8189-skywalker-baze-kb.dtbo:
      fw_config:
        mask: 0x3
        value: 0x0
    mt8189-skywalker-baze-kb-ca-fr.dtbo:
      fw_config:
        mask: 0x3
        value: 0x1
    mt8189-skywalker-baze-touchscreen.dtbo:
      fw_config:
        mask: 0x4
        value: 0x4

dooku:
  dtb:
    mt8189-skywalker-dooku.dtb: {}
  dtbo:
    mt8189-skywalker-dooku-kb-backlight.dtbo:
      fw_config:
        mask: 0x5
        value: 0x0
    mt8189-skywalker-dooku-kb-backlight-us2.dtbo:
      fw_config:
        mask: 0x5
        value: 0x4
    mt8189-skywalker-dooku-touchscreen.dtbo:
      fw_config:
        mask: 0x2
        value: 0x2
    mt8189-skywalker-dooku-kb-us2.dtbo:
      fw_config:
        mask: 0x5
        value: 0x5
    mt8189-skywalker-dooku-usbhub-bypass.dtbo:
      fw_config:
        mask: 0x8
        value: 0x8
    mt8189-skywalker-dooku-ufs.dtbo:
      fw_config:
        mask: 0xC0000000
        value: 0x00000000
    mt8189-skywalker-dooku-emmc.dtbo:
      fw_config:
        mask: 0xC0000000
        value: 0x80000000
    mt8189-skywalker-dooku-storage-unprovision.dtbo:
      fw_config:
        mask: 0xC0000000
        value: 0xC0000000

grogu:
  dtb:
    mt8189-skywalker-grogu.dtb: {}
  dtbo:
    mt8189-skywalker-grogu-kb.dtbo:
      fw_config:
        mask: 0x10
        value: 0x00
    mt8189-skywalker-grogu-kb-ca-fr.dtbo:
      fw_config:
        mask: 0x10
        value: 0x10
    mt8189-skywalker-grogu-touchscreen.dtbo:
      fw_config:
        mask: 0x20
        value: 0x20

obiwan:
  dtb:
    mt8189-skywalker-obiwan.dtb: {}
  dtbo:
    mt8189-skywalker-obiwan-touchscreen.dtbo:
      fw_config:
        mask: 0x1
        value: 0x1
    # Panel follower depends on touchscreen.
    mt8189-skywalker-obiwan-panel-follower.dtbo:
      fw_config:
        mask: 0x8
        value: 0x8
    mt8189-skywalker-obiwan-kb.dtbo:
      fw_config:
        mask: 0x2
        value: 0x0
    mt8189-skywalker-obiwan-kb-backlight.dtbo:
      fw_config:
        mask: 0x2
        value: 0x2
    mt8189-skywalker-obiwan-rt5682i.dtbo:
      fw_config:
        mask: 0x1C00000
        value: 0x0800000
    mt8189-skywalker-obiwan-rt5682s.dtbo:
      fw_config:
        mask: 0x1C00000
        value: 0x0400000

padme:
  dtb:
    mt8189-skywalker-padme.dtb: {}
  dtbo:
    mt8189-skywalker-padme-sar.dtbo:
      fw_config:
        mask: 0x1
        value: 0x1
    mt8189-skywalker-padme-rt5682s.dtbo:
      fw_config:
        mask: 0x1C00000
        value: 0x0000000
    mt8189-skywalker-padme-rt5682i.dtbo:
      fw_config:
        mask: 0x1C00000
        value: 0x0400000
    mt8189-skywalker-padme-rev1.dtbo:
      rev:
        min: 1
        max: 1

tarkin:
  dtb:
    mt8189-skywalker-tarkin.dtb: {}
  dtbo:
    mt8189-skywalker-tarkin-touchscreen.dtbo:
      fw_config:
        mask: 0x1
        value: 0x1
    # Keyboards w/ and w/o backlight have different 'linux,keymap',
    # so we don't split 'keyboard-backlight' into a separate .dtbo.
    # KB_LAYOUT (0x0000000C) | KB_BL (0x2) = 0x0000000E
    mt8189-skywalker-tarkin-kb-cm1406.dtbo:
      fw_config:
        mask: 0x0000000E
        value: 0x00000000
    mt8189-skywalker-tarkin-kb-cm1406-backlight.dtbo:
      fw_config:
        mask: 0x0000000E
        value: 0x00000002
    mt8189-skywalker-tarkin-kb-cm1405.dtbo:
      fw_config:
        mask: 0x0000000E
        value: 0x00000004
    mt8189-skywalker-tarkin-kb-cm1405-backlight.dtbo:
      fw_config:
        mask: 0x0000000E
        value: 0x00000006
    mt8189-skywalker-tarkin-kb-cm1505.dtbo:
      fw_config:
        mask: 0x0000000E
        value: 0x00000008
    mt8189-skywalker-tarkin-kb-cm1505-backlight.dtbo:
      fw_config:
        mask: 0x0000000E
        value: 0x0000000A

vader:
  dtb:
    mt8189-skywalker-vader.dtb: {}
  dtbo:
    mt8189-skywalker-vader-trackpad-11.dtbo:
      fw_config:
        mask: 0x00000002
        value: 0x00000000
    mt8189-skywalker-vader-trackpad-14.dtbo:
      fw_config:
        mask: 0x00000002
        value: 0x00000002

yoda:
  dtb:
    mt8189-skywalker-yoda.dtb: {}
  dtbo:
    mt8189-skywalker-yoda-rt5682i.dtbo:
      fw_config:
        mask: 0x1C00000
        value: 0x0800000
    mt8189-skywalker-yoda-rt5682s.dtbo:
      fw_config:
        mask: 0x1C00000
        value: 0x0400000
    mt8189-skywalker-yoda-wwan.dtbo:
      fw_config:
        mask: 0x4
        value: 0x4
