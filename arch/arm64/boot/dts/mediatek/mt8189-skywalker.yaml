DEFAULT: {}

skywalker:
  dtb:
    mt8189-skywalker.dtb:
      sku: [0x7FFFFFFF]

anakin:
  dtb:
    mt8189-skywalker-anakin.dtb: {}
  dtbo:
    mt8189-skywalker-anakin-kb-v10.dtbo:
      rev:
        max: 1
    mt8189-skywalker-anakin-touchscreen.dtbo:
      fw_config:
        mask: 0x1
        value: 0x1
    mt8189-skywalker-anakin-usb-c1.dtbo:
      fw_config:
        mask: 0x300
        value: 0x000

baze:
  dtb:
    mt8189-skywalker-baze.dtb: {}
  dtbo:
    mt8189-skywalker-baze-kb.dtbo:
      fw_config:
        mask: 0x3
        value: 0x0
    mt8189-skywalker-baze-kb-ca-fr.dtbo:
      fw_config:
        mask: 0x3
        value: 0x1
    mt8189-skywalker-baze-touchscreen.dtbo:
      fw_config:
        mask: 0x4
        value: 0x4

grogu:
  dtb:
    mt8189-skywalker-grogu-sku1114112.dtb:
      sku: [0x110000, 0x110002, 0x110004, 0x110006,
            0x110008, 0x11000A, 0x11000C, 0x11000E]
    mt8189-skywalker-grogu-sku1114113.dtb:
      sku: [0x110001, 0x110003, 0x110005, 0x110007,
            0x110009, 0x11000B, 0x11000D, 0x11000F]
    mt8189-skywalker-grogu-sku1310720.dtb:
      sku: [0x140000, 0x140001, 0x140004, 0x140005,
            0x140008, 0x140009, 0x14000C, 0x14000D,
            0x140010, 0x140011, 0x140014, 0x140015,
            0x140018, 0x140019, 0x14001C, 0x14001D]
    mt8189-skywalker-grogu-sku1310722.dtb:
      sku: [0x140002, 0x140003, 0x140006, 0x140007,
            0x14000A, 0x14000B, 0x14000E, 0x14000F,
            0x140012, 0x140013, 0x140016, 0x140017,
            0x14001A, 0x14001B, 0x14001E, 0x14001F]

obiwan:
  dtb:
    mt8189-skywalker-obiwan.dtb: {}
  dtbo:
    mt8189-skywalker-obiwan-touchscreen.dtbo:
      fw_config:
        mask: 0x1
        value: 0x1
    # Panel follower depends on touchscreen.
    mt8189-skywalker-obiwan-panel-follower.dtbo:
      fw_config:
        mask: 0x8
        value: 0x8
    mt8189-skywalker-obiwan-kb.dtbo:
      fw_config:
        mask: 0x2
        value: 0x0
    mt8189-skywalker-obiwan-kb-backlight.dtbo:
      fw_config:
        mask: 0x2
        value: 0x2
    mt8189-skywalker-obiwan-rt5682i.dtbo:
      fw_config:
        mask: 0x1C00000
        value: 0x0800000
    mt8189-skywalker-obiwan-rt5682s.dtbo:
      fw_config:
        mask: 0x1C00000
        value: 0x0400000

padme:
  dtb:
    mt8189-skywalker-padme-rev1-sku290.dtb:
      rev:
        min: 1
        max: 1
      sku: [0x122, 0x622]
    mt8189-skywalker-padme-rev1-sku546.dtb:
      rev:
        min: 1
        max: 1
      sku: [0x222, 0x422]
    mt8189-skywalker-padme-rev1-sku802.dtb:
      rev:
        min: 1
        max: 1
      sku: [0x322, 0x7FFFFF22]
    mt8189-skywalker-padme-sku290.dtb:
      rev:
        min: 2
      sku: [0x122, 0x622]
    mt8189-skywalker-padme-sku546.dtb:
      rev:
        min: 2
      sku: [0x222, 0x422]
    mt8189-skywalker-padme-sku802.dtb:
      rev:
        min: 2
      sku: [0x322, 0x7FFFFF22]
    mt8189-skywalker-padme-sku1314.dtb:
      sku: [0x522]

tarkin:
  dtb:
    mt8189-skywalker-tarkin.dtb: {}
  dtbo:
    mt8189-skywalker-tarkin-touchscreen.dtbo:
      fw_config:
        mask: 0x1
        value: 0x1
    # Keyboards w/ and w/o backlight have different 'linux,keymap',
    # so we don't split 'keyboard-backlight' into a separate .dtbo.
    # KB_LAYOUT (0x0000000C) | KB_BL (0x2) = 0x0000000E
    mt8189-skywalker-tarkin-kb-cm1406.dtbo:
      fw_config:
        mask: 0x0000000E
        value: 0x00000000
    mt8189-skywalker-tarkin-kb-cm1406-backlight.dtbo:
      fw_config:
        mask: 0x0000000E
        value: 0x00000002
    mt8189-skywalker-tarkin-kb-cm1405.dtbo:
      fw_config:
        mask: 0x0000000E
        value: 0x00000004
    mt8189-skywalker-tarkin-kb-cm1405-backlight.dtbo:
      fw_config:
        mask: 0x0000000E
        value: 0x00000006
    mt8189-skywalker-tarkin-kb-cm1505.dtbo:
      fw_config:
        mask: 0x0000000E
        value: 0x00000008
    mt8189-skywalker-tarkin-kb-cm1505-backlight.dtbo:
      fw_config:
        mask: 0x0000000E
        value: 0x0000000A

yoda:
  dtb:
    mt8189-skywalker-yoda.dtb: {}
  dtbo:
    mt8189-skywalker-yoda-rt5682i.dtbo:
      fw_config:
        mask: 0x1C00000
        value: 0x0800000
    mt8189-skywalker-yoda-rt5682s.dtbo:
      fw_config:
        mask: 0x1C00000
        value: 0x0400000
    mt8189-skywalker-yoda-wwan.dtbo:
      fw_config:
        mask: 0x4
        value: 0x4
